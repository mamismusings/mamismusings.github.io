# ---------------------------------------------------------------
#  Mami's Musings — site settings
# ---------------------------------------------------------------
title: "Mami's Musings"
title_ta: "மாமியின் எண்ணங்கள்"
description: "மாமியின் கைவண்ணத்தில் உருவான ஓவியங்களும், அவற்றின் பின்னால் உள்ள சிறு எண்ணங்களும்."
author: "மாமி"
lang: ta

url: "https://mamismusings.github.io"
baseurl: ""

# All publish_on times are India time
timezone: Asia/Kolkata

# Every picture is one file in _musings/  (see README.md)
collections:
  musings:
    output: true
    permalink: /musings/:name/

defaults:
  - scope:
      path: ""
      type: musings
    values:
      layout: musing

markdown: kramdown
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - inbox
  - vendor
  - .DS_Store

# Comments (giscus → GitHub Discussions). Fill repo_id and category_id from https://giscus.app
comments:
  repo: "mamismusings/mamismusings.github.io"
  repo_id: "R_kgDOVN_k9w"
  category: "Comments"
  category_id: "DIC_kwDOVN_k984DI1KX"
  
