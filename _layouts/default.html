<!doctype html>
<html lang="{{ site.lang | default: 'ta' }}">
<head>
{% include head.html %}
</head>
<body{% if site.likes_endpoint != blank %} data-likes="{{ site.likes_endpoint }}"{% endif %}>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-en">{{ site.title }}</span>
      <span class="brand-ta">{{ site.title_ta }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">ஓவியங்கள்</a>
      <a href="{{ '/about/' | relative_url }}">மாமி பற்றி</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>மாமியின் கைவண்ணம் · {{ site.time | date: "%Y" }}</p>
  </footer>
{% if site.likes_endpoint != blank %}<script src="{{ '/assets/js/likes.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
